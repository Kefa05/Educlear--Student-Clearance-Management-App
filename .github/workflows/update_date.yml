name: Update date every Tuesday
permissions:
  contents: write
on:
  schedule:
    # Runs at 00:00 UTC every Tuesday
    - cron: '0 0 * * 2'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update date in README.md
        run: |
          sed -i "s/Last updated: .*/Last updated: $(date +'%B %d, %Y')/" README.md
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update date to $(date +'%B %d, %Y')" || exit 0
          git push
